name: CI

# Runs the minimal tests (.ci.ston) on each Pharo version and packages the image as an artifact.
# The artifact is then published either as the continuous pre-release (push to dev)
# or uploaded to the GitHub release (release created or edited).
on:
  push:
  pull_request:
  release:
    types: [created, edited]
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"   # Run every Monday at 08:00

# Only one continuous release runs at a time on dev; other runs are not cancelled.
concurrency:
  group: ${{ github.ref == 'refs/heads/dev' && 'continuous-release' || github.run_id }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        smalltalk: [ Pharo64-15 ]
        os: [ macos-latest ]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.smalltalk }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup smalltalkCI
        uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - name: Load in New Image and Run Tests
        run: smalltalkci -s ${{ matrix.smalltalk }} .ci.ston
        shell: bash
        timeout-minutes: 15
      # Packaging runs even when the tests fail so the image can be downloaded and debugged locally.
      - name: Compute the Pharo version
        if: always()
        id: version
        env:
          SMALLTALK_IMAGE: ${{ matrix.smalltalk }}
        run: |
          echo "pharo-version=Pharo${SMALLTALK_IMAGE##*-}" >> "$GITHUB_OUTPUT"
          echo "pharo-number=${SMALLTALK_IMAGE##*-}0" >> "$GITHUB_OUTPUT"
      - name: Package image, changes, sources and version
        if: always()
        env:
          PHARO_VERSION: ${{ steps.version.outputs.pharo-version }}
          PHARO_NUMBER: ${{ steps.version.outputs.pharo-number }}
        run: |
          set -euo pipefail
          package_directory="$RUNNER_TEMP/Spec-Toplo-$PHARO_VERSION"
          mkdir -p "$package_directory"
          cp "$SMALLTALK_CI_IMAGE" "$package_directory/Spec-Toplo-$PHARO_VERSION.image"
          cp "$SMALLTALK_CI_CHANGES" "$package_directory/Spec-Toplo-$PHARO_VERSION.changes"
          cp "$(find "$SMALLTALK_CI_BUILD" "$SMALLTALK_CI_CACHE" -name '*.sources' | head -n 1)" "$package_directory/"
          printf '%s' "$PHARO_NUMBER" > "$package_directory/pharo.version"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Spec-Toplo-${{ steps.version.outputs.pharo-version }}
          path: ${{ runner.temp }}/Spec-Toplo-${{ steps.version.outputs.pharo-version }}

  # Runs even when the build failed (tests not passing) so the zips are always published on dev.
  continuous-release:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: Spec-Toplo-Pharo*
          path: dist
      - name: Zip each Pharo version
        run: |
          for directory in dist/Spec-Toplo-Pharo*/; do
            name="$(basename "$directory")"
            (cd "$directory" && zip -r "../$name.zip" .)
          done
      - name: Replace the continuous pre-release
        run: |
          gh release delete continuous --cleanup-tag --yes || true
          gh release create continuous dist/*.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Continuous build (dev)" \
            --notes "Built from commit $GITHUB_SHA. Check the CI run for the test results."

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: Spec-Toplo-Pharo*
          path: dist
      - name: Zip each Pharo version
        run: |
          for directory in dist/Spec-Toplo-Pharo*/; do
            name="$(basename "$directory")"
            (cd "$directory" && zip -r "../$name.zip" .)
          done
      - name: Upload the artifacts to the release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
